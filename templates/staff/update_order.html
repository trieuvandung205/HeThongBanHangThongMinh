{% extends "staff/base.html" %}

{% block content %}

<div class="card shadow-sm">

    <div class="card-header d-flex justify-content-between align-items-center">

        <h4 class="mb-0">

            Cập nhật trạng thái đơn hàng #{{ order.id }}

        </h4>

        <a href="{% url 'staff_order_detail' order.id %}" class="btn btn-secondary">

            <i class="bi bi-arrow-left"></i>

            Quay lại

        </a>

    </div>

    <div class="card-body">

        <form method="post">

            {% csrf_token %}

            <div class="mb-4">

                <label class="form-label">

                    Trạng thái đơn hàng

                </label>

                <select
                    name="status"
                    class="form-select"
                >

                    {% for value, text in choices %}

                        <option
                            value="{{ value }}"
                            {% if order.status == value %}
                                selected
                            {% endif %}
                        >

                            {{ text }}

                        </option>

                    {% endfor %}

                </select>

            </div>

            <button
                type="submit"
                class="btn btn-success"
            >

                <i class="bi bi-check-circle"></i>

                Lưu thay đổi

            </button>

            <a
                href="{% url 'staff_order_detail' order.id %}"
                class="btn btn-secondary"
            >

                Hủy

            </a>

        </form>

    </div>

</div>

{% endblock %}
