{% extends "staff/base.html" %}

{% block content %}

<div class="card">

    <div class="card-header d-flex justify-content-between align-items-center">

        <h4 class="mb-0">

            Thêm sản phẩm

        </h4>

        <a href="{% url 'staff_product_list' %}" class="btn btn-secondary">

            <i class="bi bi-arrow-left"></i>

            Quay lại

        </a>

    </div>

    <div class="card-body">

        <form method="POST" enctype="multipart/form-data">

            {% csrf_token %}

            <div class="row">

                <div class="col-md-6 mb-3">

                    <label class="form-label">

                        Tên sản phẩm

                    </label>

                    {{ form.name }}

                </div>

                <div class="col-md-6 mb-3">

                    <label class="form-label">

                        Danh mục

                    </label>

                    {{ form.category }}

                </div>

                <div class="col-md-6 mb-3">

                    <label class="form-label">

                        Giá

                    </label>

                    {{ form.price }}

                </div>

                <div class="col-md-6 mb-3">

                    <label class="form-label">

                        Tồn kho

                    </label>

                    {{ form.stock }}

                </div>

                <div class="col-md-12 mb-3">

                    <label class="form-label">

                        Ảnh sản phẩm

                    </label>

                    {{ form.image }}

                </div>

                <div class="col-md-12 mb-3">

                    <label class="form-label">

                        Mô tả

                    </label>

                    {{ form.description }}

                </div>

            </div>

            <button type="submit" class="btn btn-success">

                <i class="bi bi-plus-circle"></i>

                Thêm sản phẩm

            </button>

        </form>

    </div>

</div>

{% endblock %}
