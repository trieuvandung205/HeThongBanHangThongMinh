{% extends 'dashboard/base.html' %}

{% block content %}

<div class="row justify-content-center">

    <div class="col-lg-7">

        <div class="card">

            <div class="card-header">

                <h4 class="mb-0">

                    Cập nhật danh mục

                </h4>

            </div>

            <div class="card-body">

                <form method="POST">

                    {% csrf_token %}

                    <div class="mb-3">

                        <label class="form-label">

                            Tên danh mục

                        </label>

                        <input
                            type="text"
                            name="name"
                            class="form-control"
                            value="{{ category.name }}"
                            required
                        >

                    </div>

                    <div class="mb-3">

                        <label class="form-label">

                            Slug

                        </label>

                        <input
                            type="text"
                            class="form-control"
                            value="{{ category.slug }}"
                            readonly
                        >

                        <small class="text-muted">

                            Slug sẽ được tự động cập nhật khi lưu.

                        </small>

                    </div>

                    <div class="d-flex gap-2">

                        <button type="submit" class="btn btn-primary">

                            <i class="bi bi-floppy"></i>

                            Cập nhật

                        </button>

                        <a href="{% url 'category_list' %}" class="btn btn-secondary">

                            <i class="bi bi-arrow-left"></i>

                            Quay lại

                        </a>

                    </div>

                </form>

            </div>

        </div>

    </div>

</div>

{% endblock %}
